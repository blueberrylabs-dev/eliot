[package]
name = "noyau"
version = "0.1.0"
description = "Noyau d'Eliot : import des images, designs enregistrés, écriture des fichiers, export. Sans dépendance à Tauri."
authors = ["Alexandre Do"]
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = { version = "6", features = ["image"] }
sha2 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Archive .eliot : zip, compression en Rust pur (zlib-rs), sans chiffrement ni autres formats.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Polices installées sur le poste (étape 3) : liste et lecture des noms de famille.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }
# Photos libres de Pixabay (étape 3) : client HTTPS simple, sans moteur asynchrone.
ureq = "3"
# Export vidéo (étape 4) : rendu des calques SVG décrits par la fenêtre, texte compris
# (composition harfrust, polices variables), et composition des images du film.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
# Les polices de la fenêtre arrivent en base64 dans la description de la page.
base64 = "0.22"

# Le code générique des bibliothèques (réduction, encodage) est compilé dans ce paquet-ci :
# sans optimisation, la réduction d'une photo 24 Mpx passe de 0,1 s à 6,5 s (mesuré le
# 2026-10-14, JOURNAL). Ces réglages ne valent que si on compile le noyau seul (tests) ;
# l'application a les siens dans src-tauri/Cargo.toml.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
